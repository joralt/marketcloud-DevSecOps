name: MarketCloud DevSecOps Pipeline
 
on:

  push:

    branches:

      - main
 
jobs:

  sast:

    runs-on: ubuntu-latest
 
    steps:

      - name: Descargar código

        uses: actions/checkout@v7
 
      - name: Instalar Semgrep

        run: python3 -m pip install semgrep
 
      - name: Ejecutar análisis SAST

        run: semgrep scan --config semgrep.yml --error app.py

 